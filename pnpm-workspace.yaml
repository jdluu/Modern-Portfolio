  - "@img/sharp-win32-ia32@0.35.5"
  - "@img/sharp-win32-x64@0.35.5"
  - sharp@0.35.5
onlyBuiltDependencies:
  - better-sqlite3
  - sharp
overrides:
  yaml: ^2.9.0
  # Security floors for transitive packages whose parents declare a compatible
  # range, so these are advisory patches and not major bumps. pnpm 11 reads
  # `overrides` from here, NOT from package.json's `pnpm` field, which it now
  # ignores entirely.
  fast-uri: ^3.1.8
  js-yaml: ^4.3.2
  svgo: ^4.1.0
