name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for the Pages deployment: `pages: write` publishes the artifact and
# `id-token: write` lets the job authenticate via OIDC instead of a PAT.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one that is already live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pinned rather than ubuntu-latest: the latest label migrates to Ubuntu 26
    # in October 2026, and a runner image change should be a deliberate commit.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The fast gates run here too, not only in ci.yml: the two workflows are
      # independent, so without them a red lint, type error, unused dependency or
      # vulnerable package would still publish. This is deliberately the fast
      # subset rather than full parity — E2E stays in ci.yml to keep deploys
      # quick, so a commit can deploy while its E2E run is still going.
      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check

      - name: Unit tests
        run: pnpm test:unit

      - name: Knip (unused exports/deps)
        run: pnpm knip

      - name: Audit production dependencies
        run: pnpm audit --prod

      - uses: actions/configure-pages@v6

      - name: Build
        run: pnpm build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
